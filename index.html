"<!DOCTYPE html>\n<html lang=\"zh-Hant\"><head>\n<meta charset=\"utf-8\">\n<title>旅記<\u002Ftitle>\n<script src=\"3f5cb306-76b1-41af-9824-3f4690c93f81\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"420\"><meta name=\"hz:canvas-height\" content=\"900\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap\">\n<style>\nhtml,body{overscroll-behavior-y:none}\nbody{margin:0;background:#E3DCCB;font-family:'Noto Sans TC',system-ui,sans-serif;color:#11120D}\n*{font-style:normal;box-sizing:border-box}\nbutton{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}\ntextarea{font:inherit;color:inherit;display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;min-height:88px;border:1px solid #D8CFBC;border-radius:14px;background:#FFFBF4;padding:10px 12px;line-height:1.5;resize:vertical}\ninput,select{font:inherit;color:inherit;width:100%;min-width:0;max-width:100%;min-height:44px;border:1px solid #D8CFBC;border-radius:14px;background:#FFFBF4;padding:0 12px}\n.card{background:#FFFBF4;border-radius:24px;padding:18px;border:1px solid #E4DCCD}\n.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}\n.pill{min-height:44px;padding:0 16px;border-radius:999px;background:#E8E1D2;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}\n.pill.on{background:#565449;color:#FFFBF4}\n.btn{min-height:48px;border-radius:16px;background:#565449;color:#FFFBF4;font-weight:700;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px}\n.lab{font-size:13px;color:#565449;margin:14px 0 6px;font-weight:500}\n.key{min-height:48px;border-radius:14px;background:#ECE5D8;font-size:20px;font-weight:500}\n.key.op{background:#D8CFBC}\n.key.eq{background:#565449;co
