<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5EFE6">
<title>旅記</title>
<link rel="icon" type="image/jpeg" href="./favicon.jpg">
<link rel="apple-touch-icon" href="./favicon.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#EFE7DA;font-family:'Noto Sans TC',system-ui,sans-serif;color:#4A3F35}
*{font-style:normal;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit;width:100%;min-width:0;max-width:100%;min-height:44px;border:1px solid #E2D6C3;border-radius:14px;background:#FFFCF7;padding:0 12px}
.card{background:#FBF8F2;border-radius:24px;padding:18px;border:1px solid #E8DDCB}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill{min-height:44px;padding:0 16px;border-radius:999px;background:#EADFCD;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pill.on{background:#9A5F3B;color:#fff}
.btn{min-height:48px;border-radius:16px;background:#9A5F3B;color:#fff;font-weight:700;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.lab{font-size:13px;color:#6F6153;margin:14px 0 6px;font-weight:500}
.key{min-height:48px;border-radius:14px;background:#EFE5D4;font-size:20px;font-weight:500}
.key.op{background:#DCC9AC}
.key.eq{background:#7C8A6A;color:#fff}
.row{display:flex;align-items:center;gap:12px}
.sub{font-size:12px;color:#6F6153}
.nav{position:sticky;bottom:0;display:flex;background:#FBF8F2;border-top:1px solid #E8DDCB;padding:6px 8px 10px}
.nav button{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:#6F6153}
.seg{flex:1;min-height:44px;border-radius:999px;font-weight:500;color:#6F6153}
.seg.on{background:#FBF8F2;color:#4A3F35;font-weight:700;box-shadow:0 2px 6px rgba(74,63,53,.15)}
.nav button.on{color:#9A5F3B;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/html" id="tpl">
<div style="max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#F5EFE6;position:relative">
<div style="flex:1;padding:20px 16px 96px;display:flex;flex-direction:column;gap:14px">

<template data-sc="if" value="{{isHome}}" hint-placeholder-val="{{true}}">
<div class="row" style="justify-content:space-between"><h1 style="margin:0;font-size:24px">旅遊記帳</h1><div class="sub">TWD 1 ≈ KRW {{rate100}}</div></div>
<div class="card" style="background:#9A5F3B;color:#fff;border:0;position:relative">
<button onClick="{{toggleBR}}" aria-label="編輯預算與匯率" style="position:absolute;top:8px;right:8px;width:44px;height:44px;color:#fff;display:flex;align-items:center;justify-content:center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></svg></button>
<div style="font-size:13px;opacity:.9">總花費（韓幣）</div>
<div style="font-size:38px;font-weight:700;margin:4px 0">₩ {{totalKrw}}</div>
<div style="font-size:14px;opacity:.9">≈ NT$ {{totalTwd}}</div>
<div class="row" style="justify-content:space-between;margin:16px 0 8px;font-size:13px"><span>餘額 ₩ {{walletLeftKrw}} ・ 預算 ₩ {{budgetTxt}}</span><span>已使用 {{pct}}%</span></div>
<div style="height:12px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden"><div style="height:100%;border-radius:999px;background:#F5EFE6;width:{{barW}}"></div></div>
<template data-sc="if" value="{{editBR}}" hint-placeholder-val="{{false}}"><div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.3)"><div class="row"><label for="rt" style="flex:1;font-size:13px">匯率 1 TWD = KRW</label><input id="rt" type="number" step="0.01" value="{{rate}}" onChange="{{setRate}}" style="width:110px;color:#4A3F35"></div>
<div class="row" style="margin-top:8px"><label for="bd" style="flex:1;font-size:13px">預算（KRW）</label><input id="bd" type="number" value="{{budget}}" onChange="{{setBudget}}" style="width:110px;color:#4A3F35"></div>
<button class="pill" style="margin-top:12px;width:100%;color:#4A3F35" onClick="{{toggleBR}}">完成</button></div></template>
</div>
<div style="font-weight:700;margin-top:4px">最近記錄</div>
<div class="row" style="overflow-x:auto;gap:8px"><template data-sc="for" list="{{dates}}" as="d" hint-placeholder-count="3"><button class="pill {{d.on}}" style="flex:none;white-space:nowrap" onClick="{{d.go}}">{{d.t}}</button></template></div>
<template data-sc="if" value="{{noExp}}" hint-placeholder-val="{{false}}"><div class="card sub" style="text-align:center">還沒有記錄，按右下角「＋」開始記帳</div></template>
<template data-sc="for" list="{{exps}}" as="e" hint-placeholder-count="2">
<div><template data-sc="if" value="{{e.head}}" hint-placeholder-val="{{false}}"><div style="font-weight:700;margin:6px 0 10px">{{e.headTxt}}</div></template>
<div style="position:relative;overflow:hidden;border-radius:24px;border:1px solid #E8DDCB">
<div style="position:absolute;right:0;top:0;bottom:0;display:flex;width:132px;visibility:{{e.vis}}"><button onClick="{{e.edit}}" style="flex:1;background:#5F6E4D;color:#fff;font-weight:500">編輯</button><button onClick="{{e.del}}" style="flex:1;background:#9A5F3B;color:#fff;font-weight:500">刪除</button></div>
<div class="row" style="position:relative;background:#FBF8F2;touch-action:pan-y;padding:10px 4px 10px 12px;transition:transform .2s;transform:{{e.tx}}" onPointerDown="{{e.down}}" onPointerUp="{{e.up}}">
<button class="row" style="flex:1;min-width:0;text-align:left;min-height:48px;align-items:flex-start" onClick="{{e.edit}}" aria-label="編輯 {{e.name}}">
<span style="width:42px;height:42px;border-radius:50%;background:#EADFCD;display:flex;align-items:center;justify-content:center;color:#9A5F3B"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="{{e.d}}"></path></svg></span>
<span style="flex:1;min-width:0"><div style="font-weight:700">{{e.name}}</div><div class="sub">{{e.sub}}</div><template data-sc="if" value="{{e.hasNote}}" hint-placeholder-val="{{false}}"><div class="sub">備註：{{e.note}}</div></template></span>
<span style="text-align:right;flex:none"><div class="sub" style="line-height:1.5">{{e.dateTxt}}</div><div style="font-weight:700;color:{{e.color}}">{{e.amtTxt}}</div></span></button>
<button onClick="{{e.toggle}}" aria-label="顯示編輯與刪除" style="width:36px;height:44px;flex:none"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button>
</div>
</div></div>
</template>
</template>

<template data-sc="if" value="{{isWallet}}" hint-placeholder-val="{{false}}">
<h1 style="margin:0;font-size:24px">公費錢包</h1>
<div class="row" style="zoom:.72;background:#EADFCD;border-radius:999px;padding:5px;gap:0"><template data-sc="for" list="{{wTabs}}" as="t" hint-placeholder-count="3"><button class="seg {{t.on}}" onClick="{{t.go}}">{{t.t}}</button></template></div>
<template data-sc="if" value="{{wOv}}" hint-placeholder-val="{{true}}">
<div style="zoom:.72;display:flex;flex-direction:column;gap:14px">
<div class="card" style="padding:18px 18px 26px"><div class="row" style="justify-content:space-between"><span class="sub" style="font-size:15px">錢包餘額</span><div class="row" style="background:#EADFCD;border-radius:999px;padding:4px;gap:0"><template data-sc="for" list="{{wCurs}}" as="c" hint-placeholder-count="2"><button class="seg {{c.on}}" style="min-height:36px;padding:0 14px;flex:none;font-size:14px" onClick="{{c.go}}">{{c.t}}</button></template></div></div>
<div style="text-align:center;font-size:40px;font-weight:700;margin-top:22px;word-break:break-all">{{wsBal}}</div></div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<div class="card" style="padding:16px"><div class="sub" style="font-size:14px">已入金</div><div style="font-size:22px;font-weight:700;color:#5F6E4D;margin-top:6px;word-break:break-all">{{wsDep}}</div></div>
<div class="card" style="padding:16px"><div class="sub" style="font-size:14px">已支出</div><div style="font-size:22px;font-weight:700;color:#B4492F;margin-top:6px;word-break:break-all">{{wsSp}}</div></div></div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<button class="btn" style="border-radius:999px;min-height:56px" onClick="{{goDeposit}}">入金</button>
<button class="btn" style="border-radius:999px;min-height:56px;background:#FBF8F2;color:#4A3F35;border:1px solid #E2D6C3" onClick="{{goMem}}">新增成員</button></div>
<div class="row" style="justify-content:space-between;margin-top:4px"><div style="font-weight:700;font-size:18px">最近紀錄</div><button onClick="{{goRec}}" style="min-height:44px;padding:0 4px;color:#6F6153">查看 ›</button></div>
</div>
<template data-sc="if" value="{{noRecent}}" hint-placeholder-val="{{false}}"><div class="card sub" style="text-align:center">還沒有入金或公費支出記錄</div></template>
<template data-sc="for" list="{{wRecent}}" as="r" hint-placeholder-count="3"><div class="card row" style="padding:14px 16px;gap:14px"><span style="width:48px;height:48px;border-radius:50%;background:{{r.bg}};color:{{r.fg}};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none"><template data-sc="if" value="{{r.isDep}}" hint-placeholder-val="{{true}}"><span>{{r.ch}}</span></template><template data-sc="if" value="{{r.isExp}}" hint-placeholder-val="{{false}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.d}}"/></svg></template></span><span style="flex:1;min-width:0"><div style="font-weight:700">{{r.title}}</div><div class="sub">{{r.sub}}</div></span><span style="font-weight:700;color:{{r.color}};text-align:right">{{r.amt}}</span></div></template>
<div class="card"><div style="font-weight:700">支付方式餘額</div>
<template data-sc="for" list="{{wpay}}" as="w" hint-placeholder-count="2"><div style="margin-top:14px"><div class="row" style="justify-content:space-between"><span style="font-weight:500">{{w.name}}</span><span class="sub">已使用 {{w.pct}}</span></div>
<div style="font-size:24px;font-weight:700;margin-top:2px">{{w.big}}</div>
<div style="height:10px;border-radius:999px;background:#EADFCD;overflow:hidden;margin:8px 0 6px"><div style="height:100%;border-radius:999px;background:#9A5F3B;width:{{w.barW}}"></div></div>
<div class="sub">入金 {{w.dep}} ・ 花費 {{w.sp}}</div></div></template></div>
</template>
<template data-sc="if" value="{{wMem}}" hint-placeholder-val="{{false}}">
<div class="card"><div style="font-weight:700">成員</div>
<div class="sub" style="margin-bottom:4px">向左滑動可編輯或刪除</div>
<template data-sc="for" list="{{members}}" as="m" hint-placeholder-count="2">
<div style="position:relative;overflow:hidden;border-top:1px solid #E8DDCB;margin:0 -18px">
<div style="position:absolute;right:0;top:0;bottom:0;display:flex;width:132px;visibility:{{m.vis}}"><button onClick="{{m.edit}}" style="flex:1;background:#5F6E4D;color:#fff;font-weight:500">編輯</button><button onClick="{{m.del}}" style="flex:1;background:#9A5F3B;color:#fff;font-weight:500">刪除</button></div>
<div class="row" style="position:relative;background:#FBF8F2;touch-action:pan-y;min-height:56px;padding:0 8px 0 18px;transition:transform .2s;transform:{{m.tx}}" onPointerDown="{{m.down}}" onPointerUp="{{m.up}}"><span style="flex:1;min-width:0"><div style="font-weight:700">{{m.name}}</div><div class="sub">已入金 NT$ {{m.dep}}</div></span><button onClick="{{m.toggle}}" aria-label="顯示編輯與刪除" style="width:44px;height:44px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button></div>
</div></template>
<div class="row" style="margin-top:8px"><input aria-label="新成員名稱" placeholder="新增成員名稱" value="{{newMember}}" onChange="{{setNewMember}}"><button class="btn" onClick="{{addMember}}" style="font-size: 14px; flex-direction: row; width: 80px">{{mBtn}}</button></div><template data-sc="if" value="{{mEditing}}" hint-placeholder-val="{{false}}"><button class="pill" style="margin-top:10px" onClick="{{cancelMember}}">取消編輯</button></template></div>
</template>
<template data-sc="if" value="{{wRec}}" hint-placeholder-val="{{false}}">
<div class="card" style="padding-bottom:8px"><div class="row" style="justify-content:space-between"><div style="font-weight:700">{{depTitle}}</div><button onClick="{{toggleDep}}" aria-label="{{depToggleLabel}}" style="width:40px;height:40px;margin:-4px 0;border-radius:50%;background:#9A5F3B;color:#fff;display:flex;align-items:center;justify-content:center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="{{depIcon}}"></path></svg></button></div>
<template data-sc="if" value="{{depOpen}}" hint-placeholder-val="{{false}}"><div>
<div class="lab">成員</div><select aria-label="入金成員" value="{{dM}}" onChange="{{setDM}}"><template data-sc="for" list="{{members}}" as="m" hint-placeholder-count="2"><option value="{{m.id}}">{{m.name}}</option></template></select>
<div class="lab">日期</div><input type="date" aria-label="入金日期" value="{{dDate}}" onChange="{{setDDate}}">
<div class="lab">幣別</div><div class="row" style="flex-wrap:wrap"><template data-sc="for" list="{{dCurs}}" as="c" hint-placeholder-count="4"><button class="pill {{c.on}}" style="min-height:35px;padding:0 13px;font-size:13px" onClick="{{c.go}}">{{c.t}}</button></template></div>
<div class="lab">入金方式</div><div class="row" style="flex-wrap:wrap"><template data-sc="for" list="{{dWays}}" as="w" hint-placeholder-count="2"><button class="pill {{w.on}}" style="min-height:35px;padding:0 13px;font-size:13px" onClick="{{w.go}}">{{w.t}}</button></template></div>
<div class="lab">金額（{{dCur}}）</div><div class="row"><input type="number" aria-label="入金金額" placeholder="0" value="{{dA}}" onChange="{{setDA}}"><button class="btn" onClick="{{addDep}}" style="width: 80px; border-radius: 16px; font-size: 14px">{{depBtn}}</button></div>
<template data-sc="if" value="{{dEditing}}" hint-placeholder-val="{{false}}"><button class="pill" style="margin-top:10px" onClick="{{cancelDep}}">取消編輯</button></template></div></template>
<div class="sub" style="margin:10px 0 6px">向左滑動可編輯或刪除</div>
<template data-sc="if" value="{{noDeps}}" hint-placeholder-val="{{false}}"><div class="sub" style="padding:10px 0">尚無入金記錄</div></template>
<template data-sc="for" list="{{deps}}" as="d" hint-placeholder-count="1">
<div style="position:relative;overflow:hidden;border-top:1px solid #E8DDCB;margin:0 -18px;padding:0">
<div style="position:absolute;right:0;top:0;bottom:0;display:flex;width:132px;visibility:{{d.vis}}"><button onClick="{{d.edit}}" style="flex:1;background:#5F6E4D;color:#fff;font-weight:500">編輯</button><button onClick="{{d.del}}" style="flex:1;background:#9A5F3B;color:#fff;font-weight:500">刪除</button></div>
<div class="row" style="position:relative;background:#FBF8F2;touch-action:pan-y;min-height:60px;padding:0 8px 0 18px;transition:transform .2s;transform:{{d.tx}}" onPointerDown="{{d.down}}" onPointerUp="{{d.up}}"><span style="flex:1;min-width:0"><div style="font-weight:700">{{d.name}}　<span class="sub" style="font-weight:400">{{d.dateTxt}}</span></div><div class="sub">{{d.amtTxt}}</div></span><button onClick="{{d.toggle}}" aria-label="顯示編輯與刪除" style="width:44px;height:44px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button></div>
</div>
</template></div>
</template>
</template>


<template data-sc="if" value="{{isSettle}}" hint-placeholder-val="{{false}}">
<h1 style="margin:0;font-size:24px">結算分帳</h1>
<div class="row" style="zoom:.72;background:#EADFCD;border-radius:999px;padding:5px;gap:0"><template data-sc="for" list="{{sTabs}}" as="t" hint-placeholder-count="2"><button class="seg {{t.on}}" onClick="{{t.go}}">{{t.t}}</button></template></div>
<template data-sc="if" value="{{sSplit}}" hint-placeholder-val="{{true}}">
<div class="card"><div style="font-weight:700">公費錢包餘額退款</div>
<div class="sub" style="margin:4px 0 8px">（入金 NT$ {{depTotal}} − 公費支出 NT$ {{walletSpent}}）÷ {{memberCount}} 人</div>
<template data-sc="if" value="{{noMembers}}" hint-placeholder-val="{{false}}"><div class="sub">請先到公費錢包新增成員</div></template>
<template data-sc="for" list="{{refunds}}" as="r" hint-placeholder-count="2"><div class="row" style="justify-content:space-between;min-height:40px;border-top:1px solid #E8DDCB"><span>{{r.name}}</span><span style="text-align:right"><div style="color:#9A5F3B;font-weight:700">{{r.txt}}</div><div class="sub">≈ NT$ {{r.twd}}</div></span></div></template></div>
<div class="card"><div style="font-weight:700;margin-bottom:6px">誰該給誰</div>
<template data-sc="if" value="{{noLines}}" hint-placeholder-val="{{false}}"><div class="sub">目前沒有需要結算的款項</div></template>
<template data-sc="for" list="{{lines}}" as="l" hint-placeholder-count="2"><div class="row" style="padding:10px 0;border-top:1px solid #E8DDCB;justify-content:space-between"><span><b>{{l.from}}</b> 應給 <b>{{l.to}}</b></span><span style="text-align:right"><div style="color:#9A5F3B;font-weight:700">₩ {{l.krw}}</div><div class="sub">≈ NT$ {{l.amt}}</div></span></div></template></div>
<button class="btn" onClick="{{copy}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h11v11H9zM5 15V4h11"></path></svg>複製建議</button>
</template>
<template data-sc="if" value="{{sPer}}" hint-placeholder-val="{{false}}">
<div class="card"><div style="font-weight:700">個人花費</div>
<template data-sc="if" value="{{noMembers}}" hint-placeholder-val="{{false}}"><div class="sub" style="margin-top:6px">請先到公費錢包新增成員</div></template>
<template data-sc="for" list="{{pers}}" as="r" hint-placeholder-count="3"><div>
<template data-sc="if" value="{{r.isHead}}" hint-placeholder-val="{{true}}"><div class="row" style="justify-content:space-between;margin-top:16px;padding-top:10px;border-top:1px solid #E8DDCB"><b>{{r.name}}</b><span style="text-align:right"><div style="color:#9A5F3B;font-weight:700">{{r.krw}}</div><div class="sub">{{r.twd}}</div></span></div></template>
<template data-sc="if" value="{{r.isItem}}" hint-placeholder-val="{{false}}"><div class="row" style="justify-content:space-between;padding-top:8px"><span><div>{{r.title}}</div><div class="sub">{{r.sub}}</div></span><span style="text-align:right"><div>{{r.krw}}</div><div class="sub">{{r.twd}}</div></span></div></template>
</div></template></div>
</template>
</template>

</div>

<template data-sc="if" value="{{isHome}}" hint-placeholder-val="{{true}}"><button class="btn" onClick="{{openNew}}" aria-label="新增記帳" style="position:fixed;right:max(16px,calc(50vw - 224px));bottom:92px;width:60px;height:60px;border-radius:50%;padding:0;box-shadow:0 8px 20px rgba(74,63,53,.3);z-index:5"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:28px;height:28px"><path d="M12 5v14M5 12h14"></path></svg></button></template>

<div class="nav"><template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="3"><button class="{{t.on}}" onClick="{{t.go}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.label}}</button></template></div>

<template data-sc="if" value="{{modal}}" hint-placeholder-val="{{false}}">
<div style="position:fixed;inset:0;background:rgba(74,63,53,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center">
<div style="width:100%;max-width:480px;max-height:92vh;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;overscroll-behavior-x:none;background:#F5EFE6;border-radius:28px 28px 0 0;padding:18px 16px 28px">
<div class="row" style="justify-content:space-between"><b style="font-size:18px">{{formTitle}}</b><button onClick="{{closeM}}" aria-label="關閉" style="width:44px;height:44px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div class="row" style="margin-top:8px"><button class="pill {{outOn}}" style="flex:1" onClick="{{setOut}}">支出</button><button class="pill {{inOn}}" style="flex:1" onClick="{{setIn}}">收入</button></div>
<div class="lab">名稱</div><input aria-label="名稱" placeholder="例如：烤肉晚餐" value="{{f.name}}" onChange="{{setName}}">
<div class="card" style="margin-top:12px;padding:12px"><div style="text-align:right;font-size:32px;font-weight:700;min-height:44px;word-break:break-all">{{f.cur}} {{f.expr}}</div>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px"><template data-sc="for" list="{{keys}}" as="k" hint-placeholder-count="4"><button class="{{k.cls}}" onClick="{{k.go}}" aria-label="{{k.label}}">{{k.t}}</button></template></div></div>
<div class="row"><div style="flex:1;min-width:0"><div class="lab">日期</div><input type="date" aria-label="日期" value="{{f.date}}" onChange="{{setDate}}"></div><div style="flex:1;min-width:0"><div class="lab">時間（可不填）</div><input type="time" aria-label="時間" value="{{f.time}}" onChange="{{setTime}}"></div></div>
<div class="lab">幣別</div><div class="row" style="flex-wrap:wrap"><template data-sc="for" list="{{curs}}" as="c" hint-placeholder-count="4"><button class="pill {{c.on}}" style="min-height:35px;padding:0 13px;font-size:13px" onClick="{{c.go}}">{{c.t}}</button></template></div>
<div class="lab">類別</div><div class="row" style="flex-wrap:wrap"><template data-sc="for" list="{{cats}}" as="c" hint-placeholder-count="7"><button class="pill {{c.on}}" style="min-height:35px;padding:0 13px;font-size:13px" onClick="{{c.go}}"><svg class="ico" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><path d="{{c.d}}"></path></svg>{{c.id}}</button></template></div>
<div class="lab">付款人</div><select aria-label="付款人" value="{{f.payer}}" onChange="{{setPayer}}"><template data-sc="for" list="{{payers}}" as="p" hint-placeholder-count="3"><option value="{{p.id}}">{{p.name}}</option></template></select>
<div class="lab">支付方式</div><div class="row" style="flex-wrap:wrap"><template data-sc="for" list="{{pays}}" as="w" hint-placeholder-count="3"><button class="pill {{w.on}}" style="min-height:35px;padding:0 13px;font-size:13px" onClick="{{w.go}}">{{w.t}}</button></template></div>
<div class="row" style="justify-content:space-between;margin-top:14px"><div class="lab" style="margin:0">均分成員</div><div class="row" style="gap:6px"><button class="pill" style="min-height:44px;padding:0 12px;background:none;font-size:13px" onClick="{{selAll}}">全選</button><button class="pill" style="min-height:44px;padding:0 12px;background:none;font-size:13px" onClick="{{selNone}}">全不選</button></div></div>
<div class="row" style="flex-wrap:wrap"><template data-sc="for" list="{{splitM}}" as="m" hint-placeholder-count="3"><button class="pill {{m.on}}" onClick="{{m.go}}">{{m.name}}</button></template></div>
<div class="lab">備註</div><input aria-label="備註" placeholder="選填" value="{{f.note}}" onChange="{{setNote}}">
<button class="btn" style="width:100%;margin-top:18px" onClick="{{save}}">儲存</button>
</div></div>
</template>

<template data-sc="if" value="{{toast}}" hint-placeholder-val="{{false}}"><div style="position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#4A3F35;color:#fff;padding:12px 20px;border-radius:999px;z-index:20;font-size:14px">{{toast}}</div></template>

<script>
(function(){
var get=function(sc,p){var v=sc;var ks=p.split('.');for(var i=0;i<ks.length;i++){if(v==null)return undefined;v=v[ks[i]]}return v};
var hole=/\{\{\s*([\w$.]+)\s*\}\}/g,one=/^\s*\{\{\s*([\w$.]+)\s*\}\}\s*$/;
var interp=function(s,sc){return s.replace(hole,function(m,p){var v=get(sc,p);return(v==null||v===false)?'':String(v)})};
var EVT=['click','input','change','pointerdown','pointerup'];
function build(node,sc,out){
  if(node.nodeType===3){out.push(document.createTextNode(interp(node.nodeValue,sc)));return}
  if(node.nodeType!==1)return;
  if(node.nodeName==='TEMPLATE'){
    var kind=node.getAttribute('data-sc'),kids=Array.from(node.content.childNodes);
    if(kind==='if'){var m=one.exec(node.getAttribute('value')||'');if(m&&get(sc,m[1]))kids.forEach(function(k){build(k,sc,out)});return}
    if(kind==='for'){var m2=one.exec(node.getAttribute('list')||''),as=node.getAttribute('as');var arr=(m2&&get(sc,m2[1]))||[];arr.forEach(function(item){var s2=Object.create(sc);s2[as]=item;kids.forEach(function(k){build(k,s2,out)})});return}
  }
  var el=document.createElementNS(node.namespaceURI,node.localName);
  el._h={};
  Array.from(node.attributes).forEach(function(a){
    var n=a.name,v=a.value;
    if(n.indexOf('on')===0){var mm=one.exec(v);var f=mm&&get(sc,mm[1]);var t=n.slice(2);el._h[(t==='input'||t==='change')?'change':t]=f;return}
    if(n==='value'&&/^(INPUT|SELECT|TEXTAREA)$/.test(node.nodeName)){el._val=interp(v,sc);return}
    el.setAttribute(n,interp(v,sc));
  });
  EVT.forEach(function(t){el.addEventListener(t,function(e){var h=el._h[t==='input'?'change':t];if(h)h(e)})});
  var cs=[];Array.from(node.childNodes).forEach(function(c){build(c,sc,cs)});
  cs.forEach(function(c){el.appendChild(c)});

}
function sync(live,fresh){
  Array.from(live.attributes).forEach(function(a){if(!fresh.hasAttribute(a.name))live.removeAttribute(a.name)});
  Array.from(fresh.attributes).forEach(function(a){if(live.getAttribute(a.name)!==a.value)live.setAttribute(a.name,a.value)});
  live._h=fresh._h;

}
function patchKids(live,fresh){
  var fk=Array.from(fresh.childNodes);
  fk.forEach(function(f,i){
    var l=live.childNodes[i];
    if(!l){live.appendChild(f);return}
    if(l.nodeType!==f.nodeType||l.nodeName!==f.nodeName){live.replaceChild(f,l);return}

</script>
