<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F1ECE0">
<link rel="icon" type="image/jpeg" href="./favicon.jpg">
<link rel="apple-touch-icon" href="./favicon.jpg">
<title>旅記</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
html,body{overscroll-behavior-y:none}
body{margin:0;background:#E3DCCB;font-family:'Noto Sans TC',system-ui,sans-serif;color:#11120D}
*{font-style:normal;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
textarea{font:inherit;color:inherit;display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;min-height:88px;border:1px solid #D8CFBC;border-radius:14px;background:#FFFBF4;padding:10px 12px;line-height:1.5;resize:vertical}
input,select{font:inherit;color:inherit;width:100%;min-width:0;max-width:100%;min-height:44px;border:1px solid #D8CFBC;border-radius:14px;background:#FFFBF4;padding:0 12px}
.card{background:#FFFBF4;border-radius:24px;padding:18px;border:1px solid #E4DCCD}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill{min-height:44px;padding:0 16px;border-radius:999px;background:#E8E1D2;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pill.on{background:#565449;color:#FFFBF4}
.btn{min-height:48px;border-radius:16px;background:#565449;color:#FFFBF4;font-weight:700;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.lab{font-size:13px;color:#565449;margin:14px 0 6px;font-weight:500}
.key{min-height:48px;border-radius:14px;background:#ECE5D8;font-size:20px;font-weight:500}
.key.op{background:#D8CFBC}
.key.eq{background:#565449;color:#FFFBF4}
.row{display:flex;align-items:center;gap:12px}
.sub{font-size:12px;color:#565449}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;z-index:6;display:flex;background:#FFFBF4;border-top:1px solid #E4DCCD;padding:6px 8px 10px}
.nav button{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:#565449}
.seg{flex:1;min-height:44px;border-radius:999px;font-weight:500;color:#565449}
.seg.on{background:#FFFBF4;color:#11120D;font-weight:700;box-shadow:0 2px 6px rgba(17,18,13,.15)}
.dtrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:340px){.dtrow{grid-template-columns:minmax(0,1fr)}}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;line-height:44px;text-align:center;text-align-last:center}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:center;margin:0 auto;min-width:0}
input[type=date]::-webkit-datetime-edit,input[type=time]::-webkit-datetime-edit{padding:0}
.hseg{min-height:30px;min-width:48px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;color:#FFFBF4}
.hseg.on{background:#FFFBF4;color:#11120D;font-weight:700}
.nav button.on{color:#11120D;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/html" id="tpl">
<div style="max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#F1ECE0;position:relative">
<div style="flex:1;padding:20px 16px 96px;display:flex;flex-direction:column;gap:14px">

<template data-sc="if" value="{{isHome}}" hint-placeholder-val="{{true}}">
<div class="row" style="zoom:.72;background:#E8E1D2;border-radius:999px;padding:5px;gap:0"><template data-sc="for" list="{{hTabs}}" as="t" hint-placeholder-count="2"><button class="seg {{t.on}}" onClick="{{t.go}}">{{t.t}}</button></template></div>
<div class="row" style="justify-content:space-between"><h1 style="margin:0;font-size:24px">旅遊記帳</h1><button class="sub" onClick="{{toggleBR}}" aria-label="編輯匯率" style="min-height:44px;text-decoration:underline dotted;text-underline-offset:4px">{{rateTxt}}</button></div>
<div class="card" style="background:#11120D;color:#FFFBF4;border:0;position:relative">
<div class="row" style="position:absolute;top:12px;right:14px;z-index:1;background:rgba(255,251,244,.18);border-radius:999px;padding:3px;gap:0"><template data-sc="for" list="{{hCurs}}" as="c" hint-placeholder-count="2"><button class="hseg {{c.on}}" onClick="{{c.go}}">{{c.t}}</button></template></div>
<div style="position:relative;display:inline-flex;align-items:center;gap:4px;font-size:13px;opacity:.9;min-height:30px">總花費（{{hCurName}}）<svg class="ico" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg><select aria-label="選擇旅遊幣別" value="{{trip}}" onChange="{{setTrip}}" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;padding:0;border:0;cursor:pointer"><template data-sc="for" list="{{tripOpts}}" as="o" hint-placeholder-count="2"><option value="{{o.v}}">{{o.t}}</option></template></select></div>
<div style="font-size:38px;font-weight:700;margin:4px 0">{{hBig}}</div>
<div style="font-size:14px;opacity:.9">{{hSmall}}</div>
<template data-sc="if" value="{{hPub}}" hint-placeholder-val="{{true}}"><div class="row" style="justify-content:space-between;margin:16px 0 8px;font-size:13px"><span>餘額 {{hBal}}</span><span>已使用 {{wPct}}%</span></div>
<div style="height:12px;border-radius:999px;background:rgba(255,251,244,.3);overflow:hidden"><div style="height:100%;border-radius:999px;background:#FFFBF4;width:{{wBarW}}"></div></div></template>
<template data-sc="if" value="{{editBR}}" hint-placeholder-val="{{false}}"><div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,251,244,.3)"><div class="row"><label for="rt" style="flex:1;font-size:13px">{{rateLab}}</label><input id="rt" type="number" step="0.01" value="{{rate}}" onChange="{{setRate}}" style="width:110px;color:#11120D"></div>
<button class="pill" style="margin-top:12px;width:100%;color:#11120D" onClick="{{toggleBR}}">完成</button></div></template>
</div>
<div style="font-weight:700;margin-top:4px">最近記錄</div>
<div class="row" style="overflow-x:auto;gap:8px"><template data-sc="for" list="{{dates}}" as="d" hint-placeholder-count="3"><button class="pill {{d.on}}" style="flex:none;white-space:nowrap" onClick="{{d.go}}">{{d.t}}</button></template></div>
<div class="row" style="position:relative;z-index:1;justify-content:flex-end;margin-bottom:{{payMb}}"><select aria-label="支付方式篩選" value="{{payF}}" onChange="{{setPayF}}" style="width:auto;min-height:30px;border:0;border-radius:999px;background:#E8E1D2;font-size:13px;font-weight:500;padding:0 12px;color:#11120D"><template data-sc="for" list="{{payOpts}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}">{{o.t}}</option></template></select></div>
<template data-sc="if" value="{{noRes}}" hint-placeholder-val="{{false}}"><div class="card sub" style="text-align:center">沒有符合的記帳</div></template>
<template data-sc="if" value="{{noExp}}" hint-placeholder-val="{{false}}"><div class="card sub" style="text-align:center">還沒有記錄，按右下角「＋」開始記帳</div></template>
<template data-sc="for" list="{{exps}}" as="e" hint-placeholder-count="2">
<div><template data-sc="if" value="{{e.head}}" hint-placeholder-val="{{false}}"><div style="font-weight:700;margin:6px 0 10px">{{e.headTxt}}</div></template>
<div style="position:relative;overflow:hidden;border-radius:24px;border:1px solid #E4DCCD">
<div style="position:absolute;right:0;top:0;bottom:0;display:flex;width:132px;visibility:{{e.vis}}"><button onClick="{{e.edit}}" style="flex:1;background:#565449;color:#FFFBF4;font-weight:500">編輯</button><button onClick="{{e.del}}" style="flex:1;background:#11120D;color:#FFFBF4;font-weight:500">刪除</button></div>
<div class="row" style="position:relative;background:#FFFBF4;touch-action:pan-y;padding:10px 4px 10px 12px;transition:transform .2s;transform:{{e.tx}}" onPointerDown="{{e.down}}" onPointerUp="{{e.up}}">
<button class="row" style="flex:1;min-width:0;text-align:left;min-height:48px;align-items:flex-start;flex-wrap:wrap;row-gap:0" onClick="{{e.edit}}" aria-label="編輯 {{e.name}}">
<span style="position:relative;width:42px;height:42px;border-radius:50%;background:#E8E1D2;display:flex;align-items:center;justify-content:center;color:#565449"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="{{e.d}}"></path></svg><template data-sc="if" value="{{e.hasPay}}" hint-placeholder-val="{{false}}"><span style="position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:#565449;color:#FFFBF4;font-size:11px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center">{{e.payCh}}</span></template></span>
<span style="flex:1;min-width:0"><div style="font-weight:700">{{e.name}}</div><div class="sub" style="display:flex;align-items:center;flex-wrap:wrap;column-gap:6px;row-gap:4px">{{e.sub}}<template data-sc="if" value="{{e.hasProxy}}" hint-placeholder-val="{{false}}"><span style="display:inline-block;background:#565449;color:#FFFBF4;border-radius:999px;padding:0 8px;font-size:12px;font-weight:500;line-height:1.5">代</span></template><template data-sc="if" value="{{e.hasTax}}" hint-placeholder-val="{{false}}"><span style="display:inline-block;background:#E8E1D2;color:{{e.taxColor}};border-radius:999px;padding:0 10px;font-size:12px;font-weight:500;line-height:1.5">{{e.tax}}</span></template></div><template data-sc="for" list="{{e.pxLines}}" as="px" hint-placeholder-count="1"><div class="sub" style="font-size:11px;line-height:1.5;margin-top:2px;overflow-wrap:anywhere">{{px}}</div></template></span>
<span style="text-align:right;flex:none"><div class="sub" style="line-height:1.5">{{e.dateTxt}}</div><div style="font-weight:700;color:{{e.color}}">{{e.amtTxt}}</div></span><template data-sc="if" value="{{e.hasNote}}" hint-placeholder-val="{{false}}"><div style="flex:0 0 calc(100% - 54px);box-sizing:border-box;margin:6px 0 0 54px;background:#E8E1D2;border-radius:12px;padding:6px 10px;font-size:12px;line-height:1.5;color:#565449;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word">{{e.note}}</div></template></button>
<button onClick="{{e.toggle}}" aria-label="顯示編輯與刪除" style="width:36px;height:44px;flex:none"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button>
</div>
</div></div>
</template>
<template data-sc="if" value="{{showExport}}" hint-placeholder-val="{{false}}"><button class="btn" onClick="{{exportXlsx}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>匯出成 Excel</button></template>
<template data-sc="if" value="{{hasAnyExp}}" hint-placeholder-val="{{false}}"><button onClick="{{clearAll}}" style="align-self:center;min-height:44px;padding:0 12px;font-size:13px;color:#9A9384;text-decoration:underline;text-underline-offset:3px">{{clearTxt}}</button></template>
</template>

<template data-sc="if" value="{{isWallet}}" hint-placeholder-val="{{false}}">
<h1 style="margin:0;font-size:24px">公費錢包</h1>
<div class="row" style="zoom:.72;background:#E8E1D2;border-radius:999px;padding:5px;gap:0"><template data-sc="for" list="{{wTabs}}" as="t" hint-placeholder-count="3"><button class="seg {{t.on}}" onClick="{{t.go}}">{{t.t}}</button></template></div>
<template data-sc="if" value="{{wOv}}" hint-placeholder-val="{{true}}">
<div style="zoom:.72;display:flex;flex-direction:column;gap:14px">
<div class="card" style="padding:18px 18px 26px"><div class="row" style="justify-content:space-between"><span class="sub" style="font-size:15px">錢包餘額</span><div class="row" style="background:#E8E1D2;border-radius:999px;padding:4px;gap:0"><template data-sc="for" list="{{wCurs}}" as="c" hint-placeholder-count="2"><button class="seg {{c.on}}" style="min-height:36px;padding:0 14px;flex:none;font-size:14px" onClick="{{c.go}}">{{c.t}}</button></template></div></div>
<div style="text-align:center;font-size:40px;font-weight:700;margin-top:22px;word-break:break-all">{{wsBal}}</div></div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<div class="card" style="padding:16px"><div class="sub" style="font-size:14px">已入金</div><div style="font-size:22px;font-weight:700;color:#4E8EA2;margin-top:6px;word-break:break-all">{{wsDep}}</div></div>
<div class="card" style="padding:16px"><div class="sub" style="font-size:14px">已支出</div><div style="font-size:22px;font-weight:700;color:#11120D;margin-top:6px;word-break:break-all">{{wsSp}}</div></div></div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<button class="btn" style="border-radius:999px;min-height:56px" onClick="{{goDeposit}}">入金</button>
<button class="btn" style="border-radius:999px;min-height:56px;background:#FFFBF4;color:#11120D;border:1px solid #D8CFBC" onClick="{{goMem}}">新增成員</button></div>
</div>
<div class="card"><div style="font-weight:700">支付方式餘額</div>
<template data-sc="for" list="{{wpay}}" as="w" hint-placeholder-count="2"><div style="margin-top:14px"><div class="row" style="justify-content:space-between"><span style="font-weight:500">{{w.name}}</span><span class="sub">已使用 {{w.pct}}</span></div>
<div style="font-size:24px;font-weight:700;margin-top:2px">{{w.big}}</div>
<div style="height:10px;border-radius:999px;background:#E8E1D2;overflow:hidden;margin:8px 0 6px"><div style="height:100%;border-radius:999px;background:#565449;width:{{w.barW}}"></div></div>
<div class="sub">入金 {{w.dep}} ・ 花費 {{w.sp}}</div></div></template></div>
</template>
<template data-sc="if" value="{{wMem}}" hint-placeholder-val="{{false}}">
<div class="card" style="overflow:hidden"><div style="font-weight:700">成員</div>
<div class="sub" style="margin-bottom:4px">向左滑動可編輯或刪除</div>
<template data-sc="for" list="{{members}}" as="m" hint-placeholder-count="2">
<div style="position:relative;overflow:hidden;border-top:1px solid #E4DCCD;margin:0 -18px">
<div style="position:absolute;right:0;top:0;bottom:0;display:flex;width:132px;visibility:{{m.vis}}"><button onClick="{{m.edit}}" style="flex:1;background:#565449;color:#FFFBF4;font-weight:500">編輯</button><button onClick="{{m.del}}" style="flex:1;background:#11120D;color:#FFFBF4;font-weight:500">刪除</button></div>
<div class="row" style="position:relative;background:#FFFBF4;touch-action:pan-y;min-height:56px;padding:0 8px 0 18px;transition:transform .2s;transform:{{m.tx}}" onPointerDown="{{m.down}}" onPointerUp="{{m.up}}"><span style="flex:1;min-width:0"><div style="font-weight:700">{{m.name}}</div><div class="sub">已入金 NT$ {{m.dep}}</div></span><button onClick="{{m.toggle}}" aria-label="顯示編輯與刪除" style="width:44px;height:44px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button></div>
</div></template>
<div class="row" style="margin-top:8px"><input aria-label="新成員名稱" placeholder="新增成員名稱" value="{{newMember}}" onChange="{{setNewMember}}"><button class="btn" onClick="{{addMember}}" style="font-size: 14px; flex-direction: row; width: 80px">{{mBtn}}</button></div><template data-sc="if" value="{{mEditing}}" hint-placeholder-val="{{false}}"><button class="pill" style="margin-top:10px" onClick="{{cancelMember}}">取消編輯</button></template></div>
</template>
<template data-sc="if" value="{{wRec}}" hint-placeholder-val="{{false}}">
<div class="card" style="padding-bottom:8px;overflow:hidden"><div class="row" style="justify-content:space-between"><div style="font-weight:700">{{depTitle}}</div><button onClick="{{toggleDep}}" aria-label="{{depToggleLabel}}" style="width:40px;height:40px;margin:-4px 0;border-radius:50%;background:#565449;color:#FFFBF4;display:flex;align-items:center;justify-content:center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="{{depIcon}}"></path></svg></button></div>
<template data-sc="if" value="{{depOpen}}" hint-placeholder-val="{{false}}"><div>
<div class="lab">成員</div><select aria-label="入金成員" value="{{dM}}" onChange="{{setDM}}"><template data-sc="for" list="{{members}}" as="m" hint-placeholder-count="2"><option value="{{m.id}}">{{m.name}}</option></template></select>
<div class="lab">日期</div><input type="date" aria-label="入金日期" value="{{dDate}}" onChange="{{setDDate}}">
<div class="lab">幣別</div><div class="row" style="flex-wrap:wrap"><template data-sc="for" list="{{dCurs}}" as="c" hint-placeholder-count="4"><button class="pill {{c.on}}" style="min-height:35px;padding:0 13px;font-size:13px" onClick="{{c.go}}">{{c.t}}</button></template></div>
<div class="lab">入金方式</div><div class="row" style="flex-wrap:wrap"><template data-sc="for" list="{{dWays}}" as="w" hint-placeholder-count="2"><button class="pill {{w.on}}" style="min-height:35px;padding:0 13px;font-size:13px" onClick="{{w.go}}">{{w.t}}</button></template></div>
<div class="lab">金額（{{dCur}}）</div><div class="row"><input type="number" aria-label="入金金額" placeholder="0" value="{{dA}}" onChange="{{setDA}}"><button class="btn" onClick="{{addDep}}" style="width: 80px; border-radius: 16px; font-size: 14px">{{depBtn}}</button></div>
<template data-sc="if" value="{{dEditing}}" hint-placeholder-val="{{false}}"><button class="pill" style="margin-top:10px" onClick="{{cancelDep}}">取消編輯</button></template></div></template>
<div class="sub" style="margin:10px 0 6px">向左滑動可編輯或刪除</div>
<template data-sc="if" value="{{noDeps}}" hint-placeholder-val="{{false}}"><div class="sub" style="padding:10px 0">尚無入金記錄</div></template>
<template data-sc="for" list="{{deps}}" as="d" hint-placeholder-count="1">
<div style="position:relative;overflow:hidden;border-top:1px solid #E4DCCD;margin:0 -18px;padding:0">
<div style="position:absolute;right:0;top:0;bottom:0;display:flex;width:132px;visibility:{{d.vis}}"><button onClick="{{d.edit}}" style="flex:1;background:#565449;color:#FFFBF4;font-weight:500">編輯</button><button onClick="{{d.del}}" style="flex:1;background:#11120D;color:#FFFBF4;font-weight:500">刪除</button></div>
<div class="row" style="position:relative;background:#FFFBF4;touch-action:pan-y;min-height:60px;padding:0 8px 0 18px;transition:transform .2s;transform:{{d.tx}}" onPointerDown="{{d.down}}" onPointerUp="{{d.up}}"><span style="flex:1;min-width:0"><div style="font-weight:700">{{d.name}}　<span class="sub" style="font-weight:400">{{d.dateTxt}}</span></div><div class="sub">{{d.amtTxt}}</div></span><button onClick="{{d.toggle}}" aria-label="顯示編輯與刪除" style="width:44px;height:44px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button></div>
</div>
</template></div>
</template>
</template>


<template data-sc="if" value="{{isSettle}}" hint-placeholder-val="{{false}}">
<h1 style="margin:0;font-size:24px">結算分帳</h1>
<div class="row" style="zoom:.72;background:#E8E1D2;border-radius:999px;padding:5px;gap:0"><template data-sc="for" list="{{sTabs}}" as="t" hint-placeholder-count="2"><button class="seg {{t.on}}" onClick="{{t.go}}">{{t.t}}</button></template></div>
<template data-sc="if" value="{{sSplit}}" hint-placeholder-val="{{true}}">
<div class="card"><div style="font-weight:700">公費錢包餘額退款</div>
<div class="sub" style="margin:4px 0 8px">（入金 NT$ {{depTotal}} − 公費支出 NT$ {{walletSpent}}）÷ {{memberCount}} 人</div>
<template data-sc="if" value="{{noMembers}}" hint-placeholder-val="{{false}}"><div class="sub">請先到公費錢包新增成員</div></template>
<template data-sc="for" list="{{refunds}}" as="r" hint-placeholder-count="2"><div class="row" style="justify-content:space-between;min-height:40px;border-top:1px solid #E4DCCD"><span>{{r.name}}</span><span style="text-align:right"><div style="color:#565449;font-weight:700">{{r.txt}}</div><div class="sub">≈ NT$ {{r.twd}}</div></span></div></template></div>
<div class="card"><div style="font-weight:700;margin-bottom:6px">誰該給誰</div>
<template data-sc="if" value="{{noLines}}" hint-placeholder-val="{{false}}"><div class="sub">目前沒有需要結算的款項</div></template>
<template data-sc="for" list="{{lines}}" as="l" hint-placeholder-count="2"><div class="row" style="padding:10px 0;border-top:1px solid #E4DCCD;justify-content:space-between"><span><b>{{l.from}}</b> 應給 <b>{{l.to}}</b></span><span style="text-align:right"><div style="color:#565449;font-weight:700">{{sym}} {{l.krw}}</div><div class="sub">≈ NT$ {{l.amt}}</div></span></div></template></div>
<button class="btn" onClick="{{copy}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9h11v11H9zM5 15V4h11"></path></svg>複製建議</button>
</template>
<template data-sc="if" value="{{sPer}}" hint-placeholder-val="{{false}}">
<div class="card"><div style="font-weight:700">個人花費</div>
<template data-sc="if" value="{{noMembers}}" hint-placeholder-val="{{false}}"><div class="sub" style="margin-top:6px">請先到公費錢包新增成員</div></template>
<template data-sc="for" list="{{pers}}" as="r" hint-placeholder-count="3"><div>
